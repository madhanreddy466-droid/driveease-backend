<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOCE — Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Space+Mono:wght@400;700&display=swap');

:root {
  --black: #0a0a0a;
  --dark: #111111;
  --card: #181818;
  --border: #2a2a2a;
  --red: #e63030;
  --red-glow: #e6303055;
  --gold: #c9a84c;
  --white: #f5f5f0;
  --gray: #888888;
  --light: #cccccc;
  --success: #2ecc71;
  --warning: #f39c12;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }

header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 70px; width: 100%;
  background: rgba(10,10,10,0.98);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  overflow: hidden; gap: 16px;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 6px; color: var(--white); text-decoration: none; }
.logo span { color: var(--red); }
nav { display: flex; gap: 8px; }
nav a {
  background: none; border: none; color: var(--gray);
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
  font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 18px; border-radius: 4px; cursor: pointer;
  transition: all 0.2s; text-decoration: none; display: inline-block;
}
nav a:hover { color: var(--white); background: var(--border); }
nav a.active { color: var(--red); background: var(--border); }
.header-btn {
  background: var(--red); color: var(--white); border: none;
  font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; padding: 10px 24px;
  border-radius: 4px; cursor: pointer; transition: all 0.2s;
}
.header-btn:hover { background: #ff4040; box-shadow: 0 0 20px var(--red-glow); }
main { padding-top: 70px; }

.btn {
  padding: 10px 20px; border-radius: 4px; font-family: 'DM Sans', sans-serif;
  font-weight: 700; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; border: none;
}
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: #ff4040; box-shadow: 0 0 16px var(--red-glow); }
.btn-outline { background: transparent; color: var(--white); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--red); color: var(--red); }
.btn-gold { background: var(--gold); color: var(--black); }
.btn-gold:hover { background: #e0b85c; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 8px; }
.form-group input, .form-group select {
  width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; padding: 12px 16px;
  outline: none; transition: border-color 0.2s; appearance: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--red); }
.form-group select option { background: var(--card); }
.input-icon-wrap { position: relative; }
.input-icon-wrap .i-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; pointer-events: none; }
.input-icon-wrap input { padding-left: 38px; }

.toast { position: fixed; bottom: 32px; right: 32px; background: var(--card); border: 1px solid var(--success); color: var(--success); padding: 16px 24px; border-radius: 8px; font-size: 0.9rem; font-family: 'Space Mono', monospace; z-index: 9999; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
.toast.show { display: block; animation: slideUp 0.3s ease; }

.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 60px;
  position: relative;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%);
}
.auth-page::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent 79px, rgba(255,255,255,0.018) 79px, rgba(255,255,255,0.018) 80px),
    repeating-linear-gradient(0deg,  transparent 0, transparent 79px, rgba(255,255,255,0.018) 79px, rgba(255,255,255,0.018) 80px);
}
.auth-page::after {
  content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 700px; height: 700px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(230,48,48,0.12) 0%, transparent 70%);
}

.auth-right {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 480px;
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 44px 44px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(230,48,48,0.08);
  display: flex; flex-direction: column; align-items: stretch;
}
.auth-card-logo { text-align: center; margin-bottom: 28px; }
.auth-card-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; letter-spacing: 8px; color: var(--white); line-height: 1; }
.auth-card-logo-text span { color: var(--red); }
.auth-card-logo-tag { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-top: 6px; }
.auth-card-divider-top { height: 1px; background: var(--border); margin-bottom: 28px; }

.auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-divider span { font-size: 0.7rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
.auth-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 3px; color: var(--white); margin-bottom: 6px; }
.auth-sub { font-size: 0.85rem; color: var(--gray); margin-bottom: 28px; line-height: 1.5; }
.auth-social-btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--light); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
.auth-social-btn:hover { border-color: #444; background: #222; color: var(--white); }
.auth-footer-text { text-align: center; margin-top: 20px; font-size: 0.78rem; color: var(--gray); }
.auth-footer-text a { color: var(--red); cursor: pointer; text-decoration: none; font-weight: 600; }
.auth-footer-text a:hover { text-decoration: underline; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
  .auth-page { padding: 90px 12px 40px; }
  .auth-right { padding: 28px 22px 32px; border-radius: 12px; }
}


input {
    background: transparent;
    border: none;
    outline: none;

    color: white;

    font-size: 17px;

    width: 100%;
}

/* placeholder color */
input::placeholder {
    color: #666;
}

/* remove browser autofill white background */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {

    -webkit-box-shadow: 0 0 0 1000px #111 inset !important;

    -webkit-text-fill-color: white !important;

    transition: background-color 5000s ease-in-out 0s;
}
</style>
</head>
<body>

<div style="position:fixed;top:20px;right:20px;z-index:9999">
  <a href="index.html" style="color:var(--gray);font-size:1.4rem;text-decoration:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border);background:var(--card);transition:all 0.2s">✕</a>
</div>

<div class="auth-page">
  <div class="auth-right">
    <div class="auth-card-logo">
      <div class="auth-card-logo-text">VELO<span>CE</span></div>
      <div class="auth-card-logo-tag">Premium Car Rentals · Hyderabad</div>
    </div>
    <div class="auth-card-divider-top"></div>
    <div class="auth-box">

      <!-- ══════════ SIGN IN PANEL ══════════ -->
      <div class="auth-title" style="text-align: center;">WELCOME BACK</div>
      <div class="auth-sub"style="text-align: center;">Sign in to access your bookings and profile.</div>

      <button type="button" class="auth-social-btn" onclick="handleGoogleAuthPage()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>

      <div class="auth-divider"><span>or sign in with email</span></div>
<form th:action="@{/signin}" method="post">

    <!-- ERROR MESSAGE -->
    <div th:if="${param.error}"
         style="
            color:#ff4d4d;
            margin-bottom:18px;
            text-align:center;
            background:rgba(255,0,0,0.08);
            border:1px solid rgba(255,0,0,0.2);
            padding:12px;
            border-radius:10px;
         ">
        ❌ Invalid Email or Password
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}"
         style="
            color:#7dff9b;
            margin-bottom:18px;
            text-align:center;
            background:rgba(0,255,100,0.08);
            border:1px solid rgba(0,255,100,0.2);
            padding:12px;
            border-radius:10px;
         ">
        🎉 Account Created Successfully
    </div>

    <!-- EMAIL -->
    <div style="margin-bottom:24px;">

        <label style="
            display:block;
            color:#8a8a8a;
            font-size:12px;
            letter-spacing:4px;
            margin-bottom:10px;
            font-weight:600;
        ">
            EMAIL ADDRESS
        </label>

        <div style="
            display:flex;
            align-items:center;
            background:#111;
            border:1px solid #222;
            border-radius:10px;
            padding:16px;
        ">

            <span style="
                color:#777;
                margin-right:12px;
                font-size:18px;
            ">
                ✉
            </span>

            <input type="email"
                   id="li-email"
                   name="email"
                   placeholder="you@email.com"
                   required
                   style="
                        width:100%;
                        background:transparent;
                        border:none;
                        outline:none;
                        color:white;
                        font-size:17px;
                   ">
        </div>
    </div>

    <!-- PASSWORD -->
    <div style="margin-bottom:28px;">

        <label style="
            display:block;
            color:#8a8a8a;
            font-size:12px;
            letter-spacing:4px;
            margin-bottom:10px;
            font-weight:600;
        ">
            PASSWORD
        </label>

        <div style="
            display:flex;
            align-items:center;
            background:#111;
            border:1px solid #222;
            border-radius:10px;
            padding:16px;
        ">

            <span style="
                color:#777;
                margin-right:12px;
                font-size:18px;
            ">
                🔒
            </span>

            <input type="password"
                   id="li-pass"
                   name="password"
                   placeholder="Your password"
                   required
                   style="
                        width:100%;
                        background:transparent;
                        border:none;
                        outline:none;
                        color:white;
                        font-size:17px;
                   ">
        </div>
    </div>

    <!-- SIGN IN BUTTON -->
    <button type="submit"
            style="
                width:100%;
                background:#ff2b2b;
                color:white;
                border:none;
                border-radius:10px;
                padding:17px;
                font-size:18px;
                font-weight:bold;
                cursor:pointer;
                transition:0.3s;
            ">

        🔑 SIGN IN TO VELOCE

    </button>

</form>
      
      <div class="auth-footer-text">Don't have an account? <a href="/signup">Create one →</a></div>
      
      <div class="auth-footer-text" style="margin-top:10px"><a href="/admin" style="color:var(--gray)">←Access to admin</a></div>

    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


</body>
</html>
