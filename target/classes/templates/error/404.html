<!DOCTYPE html>
<html>
<head>
    <title>Error</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
            background:#f5f5f5;
        }

        .box{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:red;
        }

        a{
            text-decoration:none;
            background:#007bff;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>404 Error</h1>
    <h2>Page Not Found</h2>

    <p>The page you are trying to open does not exist.</p>

    <br>

    <a href="/home">Go To Home</a>
</div>

</body>
</html>
